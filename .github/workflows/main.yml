name: Build iOS App (No Mac Needed)

on:
  workflow_dispatch: # กดปุ่มสั่ง Build เองได้ผ่านหน้าเว็บ GitHub
  push:
    branches: [ master, main ]

jobs:
  build-ios:
    name: Build iOS IPA on Cloud Mac
    runs-on: macos-14 # ใช้เครื่อง Mac บน Cloud ของ GitHub (ฟรี)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS App (Release Mode)
        run: flutter build ios --release --no-codesign

      - name: Package into IPA format
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -9 IronPace.ipa Payload

      - name: Upload IPA to Download
        uses: actions/upload-artifact@v4
        with:
          name: IronPace-iOS
          path: build/ios/iphoneos/IronPace.ipa
          retention-days: 7

name: Build iOS App (No Mac Needed)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-ios:
    name: Build iOS IPA on Cloud Mac
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-Detect Project Directory
        id: find_project
        run: |
          # ค้นหาว่า pubspec.yaml อยู่ตรงไหน (ป้องกันกรณีมีโฟลเดอร์ซ้อน)
          PUBSPEC_PATH=$(find . -maxdepth 3 -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "❌ ไม่พบไฟล์ pubspec.yaml ใน Repository กรุณาตรวจสอบว่าอัปโหลดไฟล์ครบหรือไม่"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "✅ ตรวจพบโปรเจกต์อยู่ที่โฟลเดอร์: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        working-directory: ${{ steps.find_project.outputs.dir }}
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: ${{ steps.find_project.outputs.dir }}/ios
        run: pod install

      - name: Build iOS App (Release Mode)
        working-directory: ${{ steps.find_project.outputs.dir }}
        run: flutter build ios --release --no-codesign

      - name: Package into IPA format
        working-directory: ${{ steps.find_project.outputs.dir }}
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -9 IronPace.ipa Payload

      - name: Upload IPA to Download
        uses: actions/upload-artifact@v4
        with:
          name: IronPace-iOS
          path: ${{ steps.find_project.outputs.dir }}/build/ios/iphoneos/IronPace.ipa
          retention-days: 7
